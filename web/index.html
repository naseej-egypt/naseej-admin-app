<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Naseej Admin - Manage your carpet store">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Naseej Admin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Naseej Admin</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f1e9db;
    }

    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
    }

    .loading-logo {
      width: 120px;
      height: 120px;
      background: linear-gradient(135deg, #8b3c3c 0%, #6b2c2c 100%);
      border-radius: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
      animation: pulse 2s ease-in-out infinite;
    }

    .loading-logo svg {
      width: 60px;
      height: 60px;
      fill: white;
    }

    .loading-text {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 24px;
      color: #8b3c3c;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #f1e9db;
      border-top: 4px solid #8b3c3c;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
  </style>
</head>
<body>
<!-- Loading screen -->
<div id="loading" class="loading">
  <div class="loading-logo">
    <svg viewBox="0 0 24 24">
      <path d="M12,2L1,21H23M12,6L19.53,19H4.47M11,10V14H13V10M11,16V18H13V16"/>
    </svg>
  </div>
  <div class="loading-text">Naseej Admin</div>
  <div class="loading-spinner"></div>
</div>
<script>
  // Hide loading screen when Flutter is ready
  window.addEventListener('flutter-first-frame', function() {
    var loadingElement = document.getElementById('loading');
    if (loadingElement) {
      loadingElement.style.display = 'none';
    }
  });
</script>
</body>
</html>
